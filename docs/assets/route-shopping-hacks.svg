<svg xmlns="http://www.w3.org/2000/svg" width="584" height="870" viewBox="0 0 584 870" role="img" aria-label="Shopping Hacks numbered mission route"><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#223328" stroke-width=".5"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#77d8e7"/></marker></defs><rect width="584" height="870" rx="12" fill="#101b14"/><rect width="584" height="870" rx="12" fill="url(#grid)"/><g font-family="Segoe UI,Arial,sans-serif"><text x="24" y="31" fill="#a5bca9" font-size="12" letter-spacing="1.5">NURIGO MALL · HAJIN</text><text x="24" y="72" fill="#d1ed8a" font-size="32" font-weight="600">Shopping Hacks</text><text x="24" y="97" fill="#a5bca9" font-size="14">FOLLOW THE NUMBERS AND ARROWS</text><path d="M276 172 L299 172" fill="none" stroke="#77d8e7" stroke-width="3" marker-end="url(#arrow)"/><path d="M434 226 L434 251" fill="none" stroke="#77d8e7" stroke-width="3" marker-end="url(#arrow)"/><path d="M308 312 L285 312" fill="none" stroke="#77d8e7" stroke-width="3" marker-end="url(#arrow)"/><path d="M150 366 L150 391" fill="none" stroke="#77d8e7" stroke-width="3" marker-end="url(#arrow)"/><path d="M276 452 L299 452" fill="none" stroke="#77d8e7" stroke-width="3" marker-end="url(#arrow)"/><path d="M434 506 L434 531" fill="none" stroke="#77d8e7" stroke-width="3" marker-end="url(#arrow)"/><path d="M308 592 L285 592" fill="none" stroke="#77d8e7" stroke-width="3" marker-end="url(#arrow)"/><path d="M150 646 L150 671" fill="none" stroke="#77d8e7" stroke-width="3" marker-end="url(#arrow)"/><path d="M276 732 L299 732" fill="none" stroke="#77d8e7" stroke-width="3" marker-end="url(#arrow)"/><g><rect x="24" y="120" width="252" height="106" rx="12" fill="#1a2820" stroke="#3b5244"/><text x="39" y="146" font-size="15" fill="#77d8e7" font-weight="700">STEP 01</text><text x="39" y="176" font-size="21" fill="#f2f5ed" font-weight="600">Encampment laptop</text><text x="39" y="203" font-size="16" fill="#b6c6b9">Hack; read your code</text></g><g><rect x="308" y="120" width="252" height="106" rx="12" fill="#1a2820" stroke="#3b5244"/><text x="323" y="146" font-size="15" fill="#77d8e7" font-weight="700">STEP 02</text><text x="323" y="176" font-size="21" fill="#f2f5ed" font-weight="600">Parking · Entrance 36</text><text x="323" y="203" font-size="16" fill="#b6c6b9">Unlock the security door</text></g><g><rect x="308" y="260" width="252" height="106" rx="12" fill="#1a2820" stroke="#3b5244"/><text x="323" y="286" font-size="15" fill="#77d8e7" font-weight="700">STEP 03</text><text x="323" y="316" font-size="21" fill="#f2f5ed" font-weight="600">Security Annex</text><text x="323" y="343" font-size="16" fill="#b6c6b9">Generator, then laptop</text></g><g><rect x="24" y="260" width="252" height="106" rx="12" fill="#1a2820" stroke="#3b5244"/><text x="39" y="286" font-size="15" fill="#77d8e7" font-weight="700">STEP 04</text><text x="39" y="316" font-size="21" fill="#f2f5ed" font-weight="600">Robot dogs</text><text x="39" y="343" font-size="16" fill="#b6c6b9">Collect 4 intact K9 cores</text></g><g><rect x="24" y="400" width="252" height="106" rx="12" fill="#1a2820" stroke="#3b5244"/><text x="39" y="426" font-size="15" fill="#77d8e7" font-weight="700">STEP 05</text><text x="39" y="456" font-size="21" fill="#f2f5ed" font-weight="600">Lab-door terminal</text><text x="39" y="483" font-size="16" fill="#b6c6b9">Insert cores into all 4 slots</text></g><g><rect x="308" y="400" width="252" height="106" rx="12" fill="#1a2820" stroke="#3b5244"/><text x="323" y="426" font-size="15" fill="#77d8e7" font-weight="700">STEP 06</text><text x="323" y="456" font-size="21" fill="#f2f5ed" font-weight="600">Lab computers</text><text x="323" y="483" font-size="16" fill="#b6c6b9">Start all 5 hacks</text></g><g><rect x="308" y="540" width="252" height="106" rx="12" fill="#1a2820" stroke="#3b5244"/><text x="323" y="566" font-size="15" fill="#77d8e7" font-weight="700">STEP 07</text><text x="323" y="596" font-size="21" fill="#f2f5ed" font-weight="600">Defend the lab</text><text x="323" y="623" font-size="16" fill="#b6c6b9">Restart failed computers</text></g><g><rect x="24" y="540" width="252" height="106" rx="12" fill="#1a2820" stroke="#3b5244"/><text x="39" y="566" font-size="15" fill="#77d8e7" font-weight="700">STEP 08</text><text x="39" y="596" font-size="21" fill="#f2f5ed" font-weight="600">Lab vault</text><text x="39" y="623" font-size="16" fill="#b6c6b9">Take Bio-agent Sample</text></g><g><rect x="24" y="680" width="252" height="106" rx="12" fill="#1a2820" stroke="#3b5244"/><text x="39" y="706" font-size="15" fill="#77d8e7" font-weight="700">STEP 09</text><text x="39" y="736" font-size="21" fill="#f2f5ed" font-weight="600">Upper rooftop</text><text x="39" y="763" font-size="16" fill="#b6c6b9">Garage → ascender → ladder</text></g><g><rect x="308" y="680" width="252" height="106" rx="12" fill="#263a25" stroke="#d1ed8a"/><text x="323" y="706" font-size="15" fill="#77d8e7" font-weight="700">STEP 10</text><text x="323" y="736" font-size="21" fill="#f2f5ed" font-weight="600">Fulton extraction</text><text x="323" y="763" font-size="16" fill="#b6c6b9">Activate, then attach</text></g><text x="24" y="835" fill="#a5bca9" font-size="13">Objective order · schematic, not a floor plan</text><text x="24" y="855" fill="#a5bca9" font-size="12">Use your active in-game markers between stops. · DMZ Squad Guide</text></g></svg>